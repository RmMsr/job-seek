stages:
  - test
  - build

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
  before_script:
    # git fetches the git-sourced doc-write dependency; the rest is the
    # WeasyPrint runtime subset of the Containerfile's system-libraries
    # install (doc-write-cli shells out to WeasyPrint for CV rendering).
    # Chromium/Playwright libs are skipped — the test job never launches
    # a browser.
    - >
      apt-get update && apt-get install -y --no-install-recommends
      git libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8
      libjpeg62-turbo libgdk-pixbuf-2.0-0
      && rm -rf /var/lib/apt/lists/*
    - cp config-template.toml config.toml
  script:
    - uv sync --frozen
    - uv run pytest

build:
  stage: build
  variables:
    BUILDAH_ISOLATION: chroot
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  image: quay.io/buildah/stable
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - buildah build --layers --build-arg "VERSION=$CI_COMMIT_SHORT_SHA" --build-arg "BUILD_DATE=$(date -u +%Y-%m-%d)" --file Containerfile --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" --tag "$CI_REGISTRY_IMAGE:latest" .
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - buildah push "$CI_REGISTRY_IMAGE:latest"
