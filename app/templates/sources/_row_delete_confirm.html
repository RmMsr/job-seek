<tbody id="source-row-{{ source.id }}">
<tr style="border-bottom:1px solid #eee;">
  <td style="padding:0.5rem;" colspan="4">
    <div style="display:flex; flex-direction:column; gap:0.5rem; padding:0.75rem 1rem; background:#fff5f5; border:1px solid #f5c2c7; border-radius:6px;">
      <p style="margin:0; font-size:0.9em; color:#495057;">
        Delete <strong>{{ source.name }}</strong> and its {{ job_count }} job{{ 's' if job_count != 1 else '' }}?
        This cannot be undone.
        {% if job_count %}<a href="/jobs?source_id={{ source.id }}">View these jobs</a> first if you want to check.{% endif %}
      </p>
      <div style="display:flex; gap:0.5rem;">
        <button type="button" class="btn" style="font-size:0.85em; padding:3px 10px;"
          hx-delete="/sources/{{ source.id }}"
          hx-target="#source-row-{{ source.id }}"
          hx-swap="outerHTML">Confirm delete</button>
        <button type="button" class="btn" style="font-size:0.85em; padding:3px 10px;"
          hx-get="/sources/{{ source.id }}"
          hx-target="#source-row-{{ source.id }}"
          hx-swap="outerHTML">Cancel</button>
      </div>
    </div>
  </td>
</tr>
</tbody>
