<div class="actions" role="group" aria-label="Bulk decision">
  {% if status != "accepted" %}<button type="submit" form="bulk-form" name="status" value="accepted" class="btn btn-accept">Accept</button>{% endif %}
  {% if status != "pending" %}<button type="submit" form="bulk-form" name="status" value="pending" class="btn btn-pending">Mark pending</button>{% endif %}
  {% if status != "rejected" %}<button type="submit" form="bulk-form" name="status" value="rejected" class="btn btn-reject" title="Does not match your criteria.">Reject</button>{% endif %}
  {% if status == "trash" %}
  <button type="button" class="btn btn-delete"
    hx-post="/jobs/bulk-delete-confirm"
    hx-include="#bulk-form"
    hx-target=".decision-panel-left .actions"
    hx-swap="outerHTML">Delete</button>
  {% else %}
  <button type="submit" form="bulk-form" name="status" value="trash" class="btn" title="Not a usable posting (expired, spam, duplicate, wrong content).">Trash</button>
  {% endif %}
</div>
