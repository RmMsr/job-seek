{% import "jobs/_macros.html" as macros %}
<article class="job-row" id="job-{{ job.id }}">
  <div class="delete-confirm" style="display:flex; flex-direction:column; gap:0.5rem; padding:0.75rem 1rem; background:#fff5f5; border:1px solid #f5c2c7; border-radius:6px;">
    <p style="margin:0; font-size:0.9em; color:#495057;">Delete this job? This cannot be undone.</p>
    <div class="actions" role="group" aria-label="Confirm delete" style="display:flex; gap:0.5rem;">
      <button type="button" class="btn btn-subtle" style="font-size:0.85em; padding:3px 10px;"
        hx-get="/jobs/{{ job.id }}/collapse{{ macros.qsuffix(filter, detail=is_detail_page|default(false)) }}"
        hx-target="#job-{{ job.id }}"
        hx-swap="outerHTML">Cancel</button>
      <button type="button" class="btn btn-delete" style="font-size:0.85em; padding:3px 10px;"
        hx-delete="/jobs/{{ job.id }}"
        hx-target="#job-{{ job.id }}"
        hx-swap="outerHTML">Confirm delete</button>
    </div>
  </div>
</article>
