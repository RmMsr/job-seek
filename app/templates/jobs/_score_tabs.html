<section class="score-box score-compare" id="score-tabs-{{ job.id }}" aria-label="Scenario score comparison">
  {% if saved %}<p class="save-confirmation" aria-live="polite">Feedback saved.</p>{% endif %}
  <details class="score-compare-details"{% if saved %} open{% endif %}>
    <summary>
      <span>Scenario fit</span>
      <span class="score-compare-summary-scores">
        {% for js in job_scores %}
          <span class="score-compare-pair{% if js.relevance_score < js.scenario_gate_threshold %} score-pill-failed{% endif %}">
            <span class="tag">{{ js.scenario_name }}</span>
            <span class="score-badge score-fluid" style="{{ js.relevance_score | score_style }}">{{ "%.0f"|format(js.relevance_score * 100) }}%</span>
          </span>
        {% endfor %}
      </span>
    </summary>
    <form class="scenario-feedback-form" hx-post="/jobs/{{ job.id }}/scenario-feedback"
          hx-target="#score-tabs-{{ job.id }}" hx-swap="outerHTML">
      <div class="score-tabs">
        {% for js in job_scores %}
          <input type="radio" id="score-tab-{{ job.id }}-{{ js.scenario_id }}" name="score-tab-{{ job.id }}" class="score-tab-input" {% if js.scenario_id == job.top_passed_scenario_id %}checked{% endif %}>
          <label for="score-tab-{{ job.id }}-{{ js.scenario_id }}" class="score-tab-card{% if js.relevance_score < js.scenario_gate_threshold %} score-pill-failed{% endif %}">
            <span class="sr-only">{% if js.relevance_score >= js.scenario_gate_threshold %}Passed gate{% else %}Below gate threshold{% endif %}</span>
            <span class="tag">{{ js.scenario_name }}</span>
          </label>
          {% include "jobs/_score_tab_panel.html" %}
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-primary">Save all feedback</button>
    </form>
  </details>
</section>
