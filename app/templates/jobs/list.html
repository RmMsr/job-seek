{% extends "base.html" %}
{% block title %}Jobs — Job Seek{% endblock %}
{% block content %}
<div class="jobs-page">
<form id="bulk-form" hx-post="/jobs/bulk-feedback" hx-target="#jobs-content" hx-swap="innerHTML"></form>
{% from "_add_panel.html" import add_panel %}
<div class="page-head">
<h1>Jobs</h1>
{% call add_panel("Add") %}
<form class="add-job-by-url">
  <div style="display:flex; gap:0.5rem; align-items:center;">
    <input type="url" id="add-job-url" name="url" placeholder="Paste a job posting URL…" required style="flex:1; min-width:200px;">
    <button type="button" class="btn btn-subtle add-panel-cancel">Cancel</button>
    <button type="button" class="btn btn-primary"
      data-progress-url="/jobs/add-by-url"
      data-progress-body-url="#add-job-url"
      data-progress-target="#jobs-content"
      data-progress-action-target="#jobs-add-result"
      data-progress-display="#add-job-progress">Add</button>
  </div>
  <span id="add-job-progress" class="reset-progress" aria-live="polite"></span>
</form>
{% endcall %}
</div>
<div id="jobs-add-result" data-add-result></div>
<form class="jobs-search" role="search" onsubmit="return false">
  <input type="search" name="q" value="{{ filter.q }}" id="job-search-input"
         placeholder="Search jobs — title, organization, description…" aria-label="Search jobs"
         hx-get="/jobs" hx-target="#jobs-content" hx-swap="innerHTML" hx-push-url="true"
         hx-trigger="keyup changed delay:300ms, search"
         hx-include="#jobs-status-marker, #jobs-solo-marker, [name='scenario'], [name='source_id'], [name='org']">
  <button type="button" class="jobs-search-clear" aria-label="Clear search"
          onclick="var i=this.previousElementSibling; i.value=''; i.dispatchEvent(new Event('search')); i.focus();">×</button>
</form>
<div id="jobs-content">
  {% include "jobs/_content.html" %}
</div>
</div>
{% endblock %}
