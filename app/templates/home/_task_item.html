<li class="task-li task-li-notice" id="inbox-item-{{ notice.id }}">
  <span class="task-li-icon icon-needs_action" aria-hidden="true">!</span>
  <div class="task-li-body">
    <div class="task-li-head">
      <a class="task-li-title" href="{{ notice.link }}">{{ notice.message }}</a>
      <span class="task-age">{{ notice.created_at | age }}</span>
    </div>
    <div class="task-li-actions">
      <button type="button" class="btn" hx-post="/inbox/{{ notice.id }}/resolve"
              hx-target="#inbox-item-{{ notice.id }}" hx-swap="outerHTML">Dismiss</button>
    </div>
  </div>
</li>
