{% if proposals %}
<form hx-post="/scenarios/{{ scenario_id }}/refine/accept"
      hx-target="#criteria-{{ scenario_id }}"
      hx-swap="outerHTML">
  <input type="hidden" name="feedback_job_ids" value="{{ feedback_job_ids | default('') }}">
  <p><strong>Proposed criteria changes.</strong> Uncheck any you don't want, then apply.</p>
  {% for p in proposals %}
  <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem; padding:0.4rem; background:#f8f9fa; border-radius:4px;">
    <input type="checkbox" name="apply_{{ loop.index0 }}" checked>
    <input type="hidden" name="kind_{{ loop.index0 }}" value="{{ p.action }}">
    {% if p.action == "remove" %}
    <input type="hidden" name="criterion_id_{{ loop.index0 }}" value="{{ p.criterion_id }}">
    <span class="tag">{{ p.weight }}</span>
    <span style="flex:1; text-decoration:line-through; color:#888;">{{ p.text | markdown_inline }}</span>
    {% else %}
    <select name="weight_{{ loop.index0 }}">
      <option value="must" {% if p.weight == "must" %}selected{% endif %}>must</option>
      <option value="prefer" {% if p.weight == "prefer" %}selected{% endif %}>prefer</option>
      <option value="avoid" {% if p.weight == "avoid" %}selected{% endif %}>avoid</option>
    </select>
    <input type="text" name="text_{{ loop.index0 }}" value="{{ p.text }}" style="flex:1; min-width:200px;">
    {% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-accept">Apply changes</button>
</form>
{% else %}
<p>No changes proposed based on current feedback.</p>
{% endif %}
