<div id="scenario-header-{{ scenario.id }}">
  <form hx-post="/scenarios/{{ scenario.id }}"
        hx-target="#scenario-header-{{ scenario.id }}"
        hx-swap="outerHTML"
        style="display:flex; flex-direction:column; gap:0.5rem;">
    <input type="text" name="name" value="{{ scenario.name }}" required class="text-input" style="width:100%; box-sizing:border-box;">
    <textarea name="description" rows="4" style="width:100%; box-sizing:border-box; font-family:inherit; resize:vertical;">{{ scenario.description }}</textarea>
    <div class="threshold-block">
      <h4 class="threshold-heading">Job match threshold</h4>
      <p class="threshold-desc">How well does a job need to align with the criteria to belong in this scenario?</p>
      <div class="threshold-slider-row">
        <input type="range" name="gate_threshold" class="threshold-slider" min="0" max="1" step="0.05"
          value="{{ scenario.gate_threshold }}" aria-label="Job match threshold">
        <output class="threshold-readout">{{ "%.0f"|format(scenario.gate_threshold * 100) }}%</output>
      </div>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button type="button" class="btn btn-subtle"
        hx-get="/scenarios/{{ scenario.id }}"
        hx-target="#scenario-header-{{ scenario.id }}"
        hx-swap="outerHTML">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
