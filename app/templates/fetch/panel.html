{% extends "base.html" %}
{% block title %}Fetch — Job Seek{% endblock %}
{% block content %}
<h1>Fetch</h1>
<div style="margin-bottom:1rem;">
  {% if sources %}
  <button class="btn" data-progress-url="/fetch/all">Fetch all</button>
  {% endif %}
  <button class="btn" data-progress-url="/revisit/all">Revisit open jobs</button>
  <p class="hint">Re-checks every open job's original posting; anything that can no longer be reached is moved to Trash.</p>
</div>
<div id="fetch-content">
  {% include "fetch/_table.html" %}
</div>
{% endblock %}
