{% if error %}
<div class="notice" style="background: #f8d7da; border-color: #dc3545; color: #721c24;">
  <p>{{ error }}</p>
  <button class="notice-dismiss" onclick="this.parentElement.remove()">×</button>
</div>
<script>window.autoDismissNotice && window.autoDismissNotice(document.currentScript.previousElementSibling, 6000);</script>
<datalist id="model-options"></datalist>
{% else %}
<datalist id="model-options">
  {% for m in models %}
  <option value="{{ m }}"></option>
  {% endfor %}
</datalist>
<p style="margin:0.4rem 0 0.3rem;">{{ models|length }} model(s) loaded — click one to pick it:</p>
<div class="model-option-list" style="display:flex; flex-wrap:wrap; gap:0.35rem; max-height:12rem; overflow-y:auto;">
  {% for m in models %}
  <button type="button" class="tag" style="cursor:pointer; border:none;" data-model="{{ m }}">{{ m }}</button>
  {% endfor %}
</div>
<script>
(function () {
  document.querySelectorAll("#model-options-container .model-option-list").forEach(function (list) {
    list.addEventListener("click", function (evt) {
      var btn = evt.target.closest("[data-model]");
      if (!btn) return;
      var field = document.getElementById("model");
      field.value = btn.getAttribute("data-model");
      field.dispatchEvent(new Event("input"));
    });
  });
})();
</script>
{% endif %}
