<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Seek{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Fira+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --ground: #faf8f5;
      --surface: #ffffff;
      --border: #e6e0d8;
      --text-primary: #2a2a28;
      --text-secondary: #5f5a54;
      --text-muted: #8b8680;
      --accent: #4a7c8c;
      --accent-light: #6b96a8;
      --accent-tint: #e1e9ed;
      --success: #6b9e7f;
      --success-strong: #3f6b4f;
      --success-tint: #e8ede7;
      --warning: #d4a574;
      --warning-tint: #faf4eb;
      --alert: #b85c5c;
      --alert-tint: #f2e8e8;
      --neutral: #d0c9bf;
      --neutral-strong: #786f63;
      --score-exceptional: #b86849;
      --score-exceptional-tint: #ede5e0;
      --score-high: #4a7c8c;
      --score-high-tint: #e1e9ed;
      --score-mid: #7fa8b8;
      --score-mid-tint: #e9f0f5;
      --score-low: #b0b5b8;
      --score-low-tint: #eceaea;
      --score-neutral-tint: #e9e6e1;

      /* Continuous fit-score scale: reuses themed tokens above but trends
         toward red at the top instead of the cooler score-high teal, so a
         great match reads as "hot" rather than calm. */
      --fit-low: var(--score-low);
      --fit-low-tint: var(--score-low-tint);
      --fit-mid: var(--score-mid);
      --fit-mid-tint: var(--score-mid-tint);
      --fit-high: var(--score-exceptional);
      --fit-high-tint: var(--score-exceptional-tint);
      --fit-top: var(--alert);
      --fit-top-tint: var(--alert-tint);

      --font-serif: "Crimson Text", Georgia, serif;
      --font-sans: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ground: #1a1a18;
        --surface: #252521;
        --border: #3a3630;
        --text-primary: #f5f0eb;
        --text-secondary: #c9bfb5;
        --text-muted: #8b8680;
        --accent: #7fa8b8;
        --accent-light: #6b96a8;
        --accent-tint: #26333a;
        --success: #6b9e7f;
        --success-strong: #8fc7a3;
        --success-tint: #1f3a2f;
        --warning: #d4a574;
        --warning-tint: #3a3020;
        --alert: #d18686;
        --alert-tint: #3a1f1f;
        --neutral-strong: #b5aca0;
        --score-exceptional: #d1876a;
        --score-exceptional-tint: #3a2a22;
        --score-high: #7fa8b8;
        --score-high-tint: #223138;
        --score-mid: #6b96a8;
        --score-mid-tint: #1c2a2f;
        --score-low: #8b8f92;
        --score-low-tint: #2c2c29;
        --score-neutral-tint: #33322d;
      }
    }

    :root[data-theme="dark"] {
      --ground: #1a1a18;
      --surface: #252521;
      --border: #3a3630;
      --text-primary: #f5f0eb;
      --text-secondary: #c9bfb5;
      --text-muted: #8b8680;
      --accent: #7fa8b8;
      --accent-light: #6b96a8;
      --accent-tint: #26333a;
      --success: #6b9e7f;
      --success-strong: #8fc7a3;
      --success-tint: #1f3a2f;
      --warning: #d4a574;
      --warning-tint: #3a3020;
      --alert: #d18686;
      --alert-tint: #3a1f1f;
      --neutral-strong: #b5aca0;
      --score-exceptional: #d1876a;
      --score-exceptional-tint: #3a2a22;
      --score-high: #7fa8b8;
      --score-high-tint: #223138;
      --score-mid: #6b96a8;
      --score-mid-tint: #1c2a2f;
      --score-low: #8b8f92;
      --score-low-tint: #2c2c29;
      --score-neutral-tint: #33322d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--ground);
      color: var(--text-primary);
      line-height: 1.5;
      max-width: 880px;
      margin: 0 auto;
      padding: 1.5rem 1rem 2rem;
    }

    a { color: var(--accent); }

    h1 {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 1.8rem;
      margin: 0 0 1rem;
    }

    nav {
      position: sticky; top: 0; z-index: 20; background: var(--ground);
      margin-bottom: 1.5rem; padding-top: 0.75rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem;
    }
    nav a { text-decoration: none; color: var(--text-secondary); font-weight: 500; }
    nav a:hover { color: var(--accent); }
    nav a.active { font-weight: 600; color: var(--text-primary); }

    .setup-subnav {
      position: static; top: auto; z-index: auto; background: none;
      margin-bottom: 1.5rem; padding-top: 0; padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }
    .setup-subnav-tabs { display: flex; gap: 1.25rem; }
    .setup-subnav-version { color: var(--text-muted); font-size: 0.85em; }

    .score-badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.82em; font-weight: 600; font-family: var(--font-sans); }
    .score-exceptional { background: var(--score-exceptional-tint); color: var(--score-exceptional); }
    .score-high { background: var(--score-high-tint); color: var(--score-high); }
    .score-mid { background: var(--score-mid-tint); color: var(--score-mid); }
    .score-low { background: var(--score-low-tint); color: var(--score-low); }
    .score-neutral { background: var(--score-neutral-tint); color: var(--text-secondary); }
    .score-fluid {
      background: color-mix(in oklch, var(--from-tint) calc(100% - var(--blend)), var(--to-tint) var(--blend));
      color: color-mix(in oklch, var(--from) calc(100% - var(--blend)), var(--to) var(--blend));
    }

    .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.8em; background: var(--border); color: var(--text-secondary); }
    .tag-accent { background: var(--accent-tint); color: var(--accent); }
    .tag-feedback { background: var(--accent-tint); color: var(--accent); }

    .job-row {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 0.6rem;
      position: relative;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .job-row:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
    .job-row-stale { opacity: 0.55; }
    .job-row-stale:hover { opacity: 0.85; }
    .stale-note { margin: 0.35rem 0 0; font-size: 0.9em; color: var(--text-muted); }
    .stale-note a { color: inherit; }

    .job-row-score { flex: none; display: flex; min-width: 3.75rem; }
    .job-row-score .score-badge {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      padding: 0 0.6rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .job-select-wrap { position: absolute; top: 0.3rem; right: 0.15rem; padding: 0.35rem; cursor: pointer; line-height: 0; z-index: 2; }
    .job-select-wrap input { width: 1.15rem; height: 1.15rem; margin: 0; cursor: pointer; }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    dl.job-tags { display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; margin:0.5rem 0 0; }
    dl.job-tags dt, dl.job-tags dd { margin:0; }

    .job-row-content { flex: 1 1 auto; min-width: 0; padding: 0.75rem 0.9rem; display: flex; flex-direction: column; }
    .job-row-header { display: flex; align-items: baseline; gap: 0.9rem; padding-right: 0; }
    .job-title { margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 1.05rem; color: var(--text-primary); flex: 0 1 auto; min-width: 0; }
    .job-company { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; }
    .job-age { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
    .job-link-icon { position: absolute; top: 0.3rem; right: 0.5rem; z-index: 3;
      display: inline-flex; align-items: center; height: 1.85rem;
      text-decoration: none; font-size: 0.95rem; line-height: 1;
      padding: 0 0.3rem; border-radius: 4px; color: var(--text-muted); }
    .job-row-content:has(.job-select-wrap) .job-link-icon,
    .job-row-expanded:has(.job-select-wrap) .job-link-icon { right: 2.3rem; }
    .job-link-icon:hover { background: var(--ground); color: var(--accent); }
    .job-link-icon--copied { color: var(--accent); }
    .job-hook { margin: 0.35rem 0 0; color: var(--text-secondary); font-size: 0.92rem; line-height: 1.45; }

    .job-row-expanded { display: block; padding: 0 1.1rem 1rem; }
    /* The header reclaims the article's top padding as its own so the
       clickable (collapse) area covers that whitespace too, instead of
       leaving an inert gap above it. */
    .job-detail-header { cursor: pointer; margin: 0 -1.1rem; padding: 1rem 1.1rem 0; }
    .job-detail-title-row { display: flex; align-items: baseline; gap: 0.75rem; padding-right: 0; }
    .job-detail-title { font-family: var(--font-serif); font-weight: 600; font-size: 1.5rem; margin: 0; flex: 1 1 auto; min-width: 0; }
    .job-detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: 0.35rem; font-size: 0.9rem; color: var(--text-secondary); }
    .job-detail-meta a { color: var(--text-secondary); }
    .job-detail-meta a:hover { color: var(--accent); }
    .job-detail-header .job-hook { font-size: 0.95rem; }
    .job-detail-header dl.job-tags { margin-top: 0.75rem; }

    .score-box { margin-top:0.75rem; padding:0.75rem; border:1px solid var(--border); border-radius:6px; background:var(--ground); }
    .score-box dl.job-tags { margin-bottom:0.5rem; }
    /* Custom open/close via a JS-toggled .score-compare-open class, not
       <details>/<summary> — the native element hides ALL non-summary
       children (including a sibling pill row meant to stay visible when
       folded) via internal shadow-DOM slotting that plain author CSS can't
       override. A plain div gives full control over layout instead. */
    .score-compare-toggle { cursor:pointer; display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem; }
    .score-compare-toggle > span:first-child { font-weight:600; color: var(--text-secondary); }
    .score-compare-toggle > span:first-child::before { content:"▸"; color: var(--text-muted); margin-right:0.3rem; }
    .score-compare-open .score-compare-toggle > span:first-child::before { content:"▾"; }
    .score-pill {
      cursor:pointer; display: inline-flex; align-items: center; gap: 0; border-radius: 999px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .score-pill .tag { border-radius:0; margin:0; font-size:0.85em; background: transparent; }
    .score-pill .score-badge { border-radius:0; margin:0; }
    .score-pill-failed { text-decoration: line-through; text-decoration-color: var(--text-muted); opacity: 0.7; }
    .score-compare-note { margin:0.5rem 0 0; color: var(--text-muted); font-size:0.9em; }
    .score-compare-body { display:none; margin-top:0.75rem; }
    .score-compare-open .score-compare-body { display:block; }
    .score-tab-input { position:absolute; opacity:0; width:0; height:0; }
    .score-compare-open .score-tab-input:checked + .score-pill {
      border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
    }
    .score-tab-panel { display:none; }
    .score-tab-panel-active { display:block; }
    .fit-scorecard-grid { display:grid; grid-template-columns:auto 1fr; gap:0.4rem 0.75rem; align-items:start; margin:0; }
    .fit-scorecard-grid dt { font-weight:600; color: var(--text-secondary); }
    .fit-scorecard-grid dd { margin:0; }
    .direction-toggle { display:flex; gap:0.4rem; margin:0.4rem 0; }
    .direction-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); }
    .scenario-feedback-form textarea { width:100%; min-height:3em; margin:0.3rem 0; }
    .scenario-feedback-form > button[type="submit"] { margin-top:0.5rem; }
    .save-confirmation { margin:0 0 0.5rem; padding:0.3rem 0.6rem; border-radius:4px; background: var(--success-tint); color: var(--success); font-size:0.9em; overflow:hidden; animation: fade-out 2.5s ease-in forwards; }
    @keyframes fade-out {
      0%, 60% { opacity:1; max-height:3rem; margin-bottom:0.5rem; padding-top:0.3rem; padding-bottom:0.3rem; }
      100% { opacity:0; max-height:0; margin-bottom:0; padding-top:0; padding-bottom:0; }
    }
    .job-row-target-highlight, .source-row-target-highlight { animation: target-highlight 2.5s ease-out; }
    @keyframes target-highlight {
      0% { background: var(--warning-tint); }
      100% { background: transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    }
    .job-details { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .decision-panel { grid-template-columns: 1fr minmax(180px, auto); gap: 0.5rem 1rem; }
    .decision-panel-left { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; }
    .decision-panel-left .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: auto 0 0; }
    .decision-panel-note { display: flex; flex-direction: column; margin: 0; }
    .decision-panel-note textarea { flex: 1; width: 100%; min-height: 60px; box-sizing: border-box; resize: vertical; }
    .bulk-clear-x { position: absolute; top: 0.4rem; right: 0.5rem; padding: 0 6px; line-height: 1.4;
      border: none; border-radius: 4px; background: transparent; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .bulk-clear-x:hover { color: var(--text-primary); background: var(--ground); }
    .btn, select, .text-input,
    input[type="text"], input[type="url"], input[type="number"], input[type="email"], input[type="search"] {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); box-sizing: border-box;
      font: inherit; background: var(--surface); color: var(--text-primary);
    }
    .text-input { width: 100%; max-width: 480px; }
    .btn { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-light); border-color: var(--accent-light); }
    .btn-accept { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
    .btn-accept:hover { filter: brightness(1.08); }
    .btn-reject { background: var(--alert); border-color: var(--alert); color: #fff; font-weight: 600; }
    .btn-reject:hover { filter: brightness(1.08); }
    .btn-delete { background: var(--alert); color: #fff; border-color: var(--alert); font-weight: 600; }
    .btn-delete:hover { filter: brightness(1.08); }
    .btn-subtle { background: none; border-color: transparent; color: var(--text-muted); }
    .btn-subtle:hover { color: var(--text-primary); border-color: var(--border); background: var(--ground); }
    .job-advanced { display: inline-flex; align-items: center; gap: 0.5rem; }
    .feedback-form + .job-advanced { margin-top: 0.5rem; }
    .job-advanced summary { cursor: pointer; color: var(--text-muted); font-size: 0.85em; user-select: none; }
    .feedback-form label { display: block; margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.92rem; }
    .setup-form .form-row { margin-bottom: 1.1rem; }
    .setup-form .form-row label { display: block; margin-bottom: 0.35rem; font-weight: 500; }
    .feedback-form textarea { width: 100%; min-height: 60px; }
    .feedback-form .actions { margin-top: 0.75rem; }
    textarea, input, select { font-family: inherit; background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; }
    textarea { padding: 0.75rem; }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
    .reset-progress { grid-column: 1 / -1; display: block; width: 100%; color: var(--text-muted); font-size: 0.85em; }
    .reset-progress:empty { display: none; }
    .filter-bar { margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .filter-bar a { margin-right: 0.5rem; color: var(--text-secondary); text-decoration: none; }
    .filter-bar a:hover { color: var(--accent); }
    .filter-bar a.active { font-weight: 600; color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--accent); }
    .select-all { display: flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); white-space: nowrap; }
    .select-all input { width: 1.15rem; height: 1.15rem; margin: 0; cursor: pointer; }
    body:has(input[name="job_ids"]:checked) { padding-bottom: calc(var(--status-bar-h, 0px) + var(--bulk-bar-h, 9rem) + 4rem); }
    .bulk-bar { display: none; position: fixed; bottom: var(--status-bar-h, 0px); left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 880px; box-sizing: border-box; z-index: 10;
      background: var(--surface); border-top: 2px solid var(--accent); box-shadow: 0 -2px 12px rgba(0,0,0,0.08); padding: 0.75rem 1rem;
      transition: bottom 0.15s ease; }
    #jobs-content:has(input[name="job_ids"]:checked) .bulk-bar { display: grid; }
    .config-banner { background: var(--alert-tint); color: var(--alert); border: 2px solid var(--alert); border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-size: 1.05rem; }
    .config-banner strong { display: block; margin-bottom: 0.25rem; }
    .checklist { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    .checklist li { padding: 0.4rem 0; }
    .checklist li.done a { color: var(--success-strong); font-weight: 600; }
    .checklist li.todo a { color: var(--accent); font-weight: 600; }
    .task-checklist { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    .task-li { display: flex; align-items: baseline; gap: 0.55rem; padding: 0.4rem 0; border-top: 1px solid var(--border); }
    .task-li:first-child { border-top: none; }
    .task-li-icon { flex: none; width: 1.1rem; text-align: center; font-weight: 700; color: var(--text-muted); }
    .task-li-icon.icon-done { color: var(--success); }
    .task-li-icon.icon-failed { color: var(--alert); }
    .task-li-icon.icon-needs_action { color: var(--warning); }
    .task-li-icon.icon-running { color: var(--accent); }
    .task-li-body { flex: 1 1 auto; min-width: 0; }
    .task-li-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
    .task-li-title { font-family: var(--font-serif); font-weight: 600; text-decoration: none; }
    .task-li-title.task-completed { text-decoration: line-through; color: var(--text-muted); }
    .task-li-head .task-age { margin-left: auto; white-space: nowrap; flex: none; }
    .task-li-sub { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.6rem;
      margin-top: 0.15rem; font-size: 0.88rem; color: var(--text-secondary); }
    .task-li-error { color: var(--alert); }
    .task-li-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
      margin-top: 0.45rem; }
    .task-li-actions form { display: inline; margin: 0; }
    .task-li-actions .btn { font-size: 0.9rem; }
    .actionable-block { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;
      margin-bottom: 1.5rem; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }

    .scenario-name-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .scenario-name-row h2 { margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 1.3rem; }
    .threshold-block { margin-top: 0.75rem; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); max-width: 420px; }
    .threshold-heading { margin: 0 0 0.3rem; font-size: 0.95rem; }
    .threshold-desc { margin: 0 0 0.6rem; font-size: 0.85em; color: var(--text-secondary); }
    .threshold-slider-row { display: flex; align-items: center; gap: 0.75rem; }
    .threshold-slider { flex: 1; accent-color: var(--accent); }
    .threshold-readout { font-weight: 600; min-width: 3em; text-align: right; }

    .scenario-tab-nav { display: flex; gap: 1.25rem; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .scenario-tab-input { position: absolute; opacity: 0; width: 0; height: 0; }
    .scenario-tab-link { cursor: pointer; padding: 0.4rem 0; color: var(--text-secondary); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .scenario-tab-link:hover { color: var(--accent); }
    .scenario-tab-input:checked + .scenario-tab-link { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--accent); }
    .scenario-tab-link.has-new-suggestions::after {
      content: ""; display: inline-block; width: 0.4em; height: 0.4em; margin-left: 0.4em;
      border-radius: 50%; background: var(--accent); vertical-align: middle;
    }
    .scenario-tab-panel { display: none; }
    .scenario-tab-panel-active { display: block; }

    .scenario-feedback-block { margin-top: 0.75rem; border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; }
    .scenario-feedback-block-target-highlight { animation: target-highlight 2.5s ease-out; }

    .add-panel { margin-bottom: 1.5rem; }
    [data-add-result]:not(:empty) { margin-bottom: 1.5rem; }
    .add-panel-toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .add-panel-body { display: grid; grid-template-rows: 0fr; overflow: hidden; transition: grid-template-rows 0.25s ease; }
    .add-panel-open .add-panel-body { grid-template-rows: 1fr; }
    .add-panel-body-inner { overflow: hidden; min-height: 0; padding-top: 0.75rem; }
    .how-it-works ol { padding-left: 1.25rem; }
    .how-it-works li { margin-bottom: 0.5rem; }
    .how-it-works li ol { list-style-type: lower-alpha; margin-top: 0.5rem; }
    .how-it-works li ol li { color: var(--text-secondary); }
    #notice-stack:empty { display: none; }
    #notice-stack { position: fixed; bottom: calc(3rem + var(--status-bar-h, 0px) + var(--bulk-bar-h, 0px)); left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 960px; box-sizing: border-box; padding: 0 1rem; z-index: 25;
      transition: bottom 0.15s ease; }
    .notice { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;
      padding: 0.6rem 0.9rem; margin-bottom: 0.75rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: opacity 0.4s ease; }
    .notice.notice-fade-out { opacity: 0; }
    .notice p { margin: 0; }
    .notice-warning { background: var(--warning-tint); border-color: var(--warning); color: var(--warning); }
    .notice-dismiss { flex: none; background: none; border: none; cursor: pointer; font-size: 1.1rem;
      line-height: 1; color: inherit; opacity: 0.6; padding: 0 0.15rem; }
    .notice-dismiss:hover { opacity: 1; }
    .task-completed { text-decoration: line-through; color: #888; }
    .task-age { margin-left: 0.5rem; font-size: 0.8rem; color: var(--text-muted); }
    .progress-trigger-busy { opacity: 0.55; pointer-events: none; }
    @media (prefers-reduced-motion: no-preference) {
      .progress-trigger-busy { animation: trigger-pulse 1.2s ease-in-out infinite; }
    }
    @keyframes trigger-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent); }
      50% { box-shadow: 0 0 0 3px var(--accent-tint); }
    }
    .task-meta { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.9rem; margin: 0 0 1.25rem; }
    .task-meta dt { color: var(--text-muted); }
    .task-meta dd { margin: 0; }
    .task-log { background: var(--ground); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.75rem 1rem; white-space: pre-wrap; overflow-x: auto; }
    .task-log-details { margin-top: 1.25rem; }
    .task-log-details summary { cursor: pointer; color: var(--text-secondary); }
    .resolved-panel { margin: 1rem 0; padding: 0.6rem 0.9rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); color: var(--text-secondary); }
    .resolved-panel p { margin: 0.15rem 0; }
    .resume-subtitle { margin: -0.5rem 0 0; color: var(--text-muted); font-size: 0.9rem; }
    .resume-subtitle .task-age { margin-left: 0; }
    .resume-message { color: var(--text-secondary); }
    .resume-dismiss { margin-top: 1rem; }
    .resume-panel { display: flex; flex-direction: column; gap: 1rem; max-width: 640px;
      padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .resume-panel > p { margin: 0; line-height: 1.5; }
    .resume-panel-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .resume-panel-field > label { font-size: 0.85em; color: var(--text-secondary); }
    .resume-panel-field input[type="text"], .resume-panel-field input[type="url"] { width: 100%; }
    .resume-panel-note { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
    .resume-panel-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .resume-panel-warn { color: var(--alert); }
    /* On the task detail page the panel's own inline Cancel link is replaced
       by the page's Dismiss button. */
    #resume-page a.btn { display: none; }
    .task-breadcrumb { margin: 0 0 0.25rem; font-size: 0.85rem; color: var(--text-muted); }
    .task-breadcrumb a { color: var(--text-secondary); }
    #status-bar:empty { display: none; }
    #status-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 960px; box-sizing: border-box; z-index: 20;
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      background: #212529; color: #f8f9fa; font-size: 0.85em;
      padding: 0.5rem 1rem; border-radius: 6px 6px 0 0; box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
      transition: bottom 0.15s ease; }
    #status-bar a { color: #9ec5fe; }
    .status-bar-dismiss { margin-left: auto; background: none; border: none; color: inherit;
      opacity: 0.6; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 0.15rem; }
    .status-bar-dismiss:hover { opacity: 1; }
    .status-bar-progress-track { display: inline-block; flex: none; width: 80px; height: 6px; border-radius: 3px;
      background: #495057; overflow: hidden; }
    .status-bar-progress-fill { display: block; height: 100%; background: #0d6efd; }

    /* Contains horizontal overflow to the table itself instead of letting a
       wide table push the whole page wider than the viewport, which on
       narrow screens also breaks the nav's position:sticky. */
    .responsive-table-wrap { overflow-x: auto; }

    @media (max-width: 600px) {
      /* Let the title/headline text wrap around the select checkbox and
         link icon instead of always starting on its own line below the
         header. Floats (rather than flex siblings) only narrow the lines
         that overlap their height — a long wrapped title reclaims full
         width once past them, instead of staying narrowed for every line. */
      .job-row-content { display: block; }
      .job-select-wrap { position: static; float: right; margin: 0 0 0.3rem 0.5rem; }
      .job-link-icon { position: static; float: right; height: auto; margin: 0 0 0.3rem 0.3rem; padding: 0.2rem 0.3rem; }
      .job-row-content:has(.job-select-wrap) .job-link-icon,
      .job-row-expanded:has(.job-select-wrap) .job-link-icon { right: auto; }
      .job-row-header { display: block; padding-right: 0; }
      .job-row-header .job-company, .job-row-header .job-age { margin-right: 0.6rem; }
    }
  </style>
</head>
<body>
  <script>
    window.autoDismissNotice = function (el, delayMs) {
      if (!el) return;
      setTimeout(function () {
        el.classList.add("notice-fade-out");
        setTimeout(function () { if (el.parentNode) el.remove(); }, 600);
      }, delayMs || 30000);
    };
  </script>
  <nav>
    <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Start</a>
    <a href="/jobs" {% if request.url.path == "/jobs" %}class="active"{% endif %}>Jobs</a>
    <a href="/fetch" {% if request.url.path == "/fetch" %}class="active"{% endif %}>Fetch</a>
    <a href="/profile" {% if request.url.path == "/profile" %}class="active"{% endif %}>Profile</a>
    <a href="/scenarios" {% if request.url.path == "/scenarios" %}class="active"{% endif %}>Scenarios</a>
    <a href="/setup" {% if request.url.path in ("/setup", "/sources") %}class="active"{% endif %}>Setup</a>
  </nav>
  <div id="notice-stack" aria-live="polite"></div>
  <main>{% block content %}{% endblock %}</main>
  <div id="status-bar"></div>
  <script>
    (function () {
      function showNotice(html, level) {
        var stack = document.getElementById("notice-stack");
        if (!stack) return;
        var wrapper = document.createElement("div");
        wrapper.className = "notice" + (level === "warning" ? " notice-warning" : "");
        var content = document.createElement("div");
        content.innerHTML = html;
        var dismissBtn = document.createElement("button");
        dismissBtn.type = "button";
        dismissBtn.className = "notice-dismiss";
        dismissBtn.setAttribute("aria-label", "Dismiss");
        dismissBtn.textContent = "×";
        dismissBtn.addEventListener("click", function () { wrapper.remove(); });
        wrapper.appendChild(content);
        wrapper.appendChild(dismissBtn);
        stack.appendChild(wrapper);
        setTimeout(function () {
          wrapper.classList.add("notice-fade-out");
          setTimeout(function () {
            if (wrapper.parentNode) wrapper.remove();
          }, 400);
        }, 5000);
      }

      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function applyOob(chunk) {
        var container = document.createElement("div");
        container.innerHTML = chunk;
        Array.prototype.forEach.call(container.children, function (node) {
          if (!node.id) return;
          var existing = document.getElementById(node.id);
          if (!existing) return;
          existing.outerHTML = node.outerHTML;
          var replaced = document.getElementById(node.id);
          if (replaced && window.htmx) window.htmx.process(replaced);
        });
      }

      function flashHighlight(el, className, onComplete) {
        if (!el) return;
        el.classList.remove(className);
        void el.offsetWidth;
        el.classList.add(className);
        el.addEventListener("animationend", function () {
          el.classList.remove(className);
          if (onComplete) onComplete();
        }, { once: true });
      }

      // The refine-all notice links to #proposals-area-<id> for every scenario
      // that got new proposals — reuse that instead of threading scenario ids
      // through the task result separately.
      function scenarioIdsFromNotices(notices) {
        var ids = [];
        (notices || []).forEach(function (n) {
          var re = /href="#proposals-area-(\d+)"/g;
          var m;
          while ((m = re.exec(n.html))) ids.push(m[1]);
        });
        return ids;
      }

      function highlightAffectedScenarios(ids) {
        ids.forEach(function (id) {
          var link = document.querySelector('label[for="scenario-tab-' + id + '"]');
          if (link) link.classList.add("has-new-suggestions");
          var block = document.getElementById("proposals-area-" + id);
          if (block) block = block.closest(".scenario-feedback-block") || block;
          // The flash animation only actually plays on the currently visible
          // (active) tab's panel — display:none panels never start a CSS
          // animation, so this callback only fires there. That's the signal
          // the user has already seen it; clear its dot. Inactive tabs keep
          // theirs until the tab-switch listener below clears it.
          flashHighlight(block, "scenario-feedback-block-target-highlight", function () {
            if (link) link.classList.remove("has-new-suggestions");
          });
        });
      }

      var resumePage = document.getElementById("resume-page");

      function resetTrigger(el) {
        if (!el) return;
        delete el.dataset.progressRunning;
        el.removeAttribute("aria-disabled");
        el.classList.remove("progress-trigger-busy");
      }

      var watched = {}; // task_id -> {el, targetSelector, oobMode, bodyFieldNames}

      function finishWatched(taskId, task) {
        var w = watched[taskId];
        if (!w) return;
        delete watched[taskId];
        if (task.status === "failed") {
          resetTrigger(w.el);
          showNotice("<p>" + escapeHtml(task.error || "Failed") + "</p>", "warning");
          return;
        }
        // The task detail page (formerly the standalone resume page) has no
        // in-page target to swap into. If the task now needs the *next*
        // decision, reload so the fresh panel shows; otherwise the action
        // succeeded — go back where we came from, reloaded.
        if (resumePage) {
          if (task.status === "needs_action") {
            window.location.reload();
            return;
          }
          var dest = "/";
          var ref = document.referrer;
          if (ref) {
            try {
              var u = new URL(ref);
              if (u.origin === window.location.origin && u.pathname !== window.location.pathname) {
                dest = ref;
              }
            } catch (e) {}
          }
          window.location.assign(dest);
          return;
        }
        var result = task.result || {};
        (result.notices || []).forEach(function (n) { showNotice(n.html, n.level); });
        // Where the result actually lands: a `needs_action` panel goes to the
        // action target when one is set, everything else to the primary target.
        var landingSelector = (result.needs_action && w.actionTarget) ? w.actionTarget : w.targetSelector;
        // A needs-action panel that renders outside its own add-panel (e.g. the
        // Jobs "Add" panel drops its confirm step into #jobs-add-result) would
        // otherwise leave the now-stale input form open above it. Collapse it.
        if (result.needs_action) {
          var addPanel = w.el.closest(".add-panel");
          var landing = landingSelector && document.querySelector(landingSelector);
          if (addPanel && (!landing || !addPanel.contains(landing))) {
            addPanel.classList.remove("add-panel-open");
          }
        }
        var chunks = result.html_chunks || [];
        for (var k = 0; k < w.bodyFieldNames.length; k++) {
          var clearFieldEl = document.querySelector(w.el.getAttribute("data-progress-body-" + w.bodyFieldNames[k]));
          if (clearFieldEl) clearFieldEl.value = "";
        }
        if (w.oobMode) {
          chunks.forEach(applyOob);
          highlightAffectedScenarios(scenarioIdsFromNotices(result.notices));
        } else if (w.targetSelector && chunks.length) {
          var target = document.querySelector(landingSelector);
          if (target) {
            target.innerHTML = chunks[chunks.length - 1];
            if (window.htmx) window.htmx.process(target);
            if (target.id.indexOf("proposals-area-") === 0) {
              flashHighlight(target.closest(".scenario-feedback-block") || target, "scenario-feedback-block-target-highlight");
            }
          }
          // Terminal result: drop any stale confirm panel left in the action target.
          if (w.actionTarget && !result.needs_action) {
            var staleAction = document.querySelector(w.actionTarget);
            if (staleAction && staleAction !== target) staleAction.innerHTML = "";
          }
        } else if (!w.oobMode && !chunks.length) {
          location.reload();
        }
        // Removed only after the swap above lands, so anything watching this
        // attribute (e.g. profile/_editor.html's textarea-lock safety net)
        // sees the real post-swap DOM state, not a still-empty target.
        resetTrigger(w.el);
      }

      var WATCH_TERMINAL = ["done", "failed", "needs_action"];

      function pollWatched(taskId) {
        var w = watched[taskId];
        if (!w) return;
        fetch("/tasks/" + taskId + "/state").then(function (r) { return r.json(); }).then(function (task) {
          if (!watched[taskId]) return;
          if (WATCH_TERMINAL.indexOf(task.status) !== -1) {
            finishWatched(taskId, task);
          } else {
            setTimeout(function () { pollWatched(taskId); }, 2000);
          }
        }).catch(function () {
          setTimeout(function () { pollWatched(taskId); }, 2000);
        });
      }

      function progressLabel(el) {
        return el.getAttribute("data-progress-label") || el.textContent.trim();
      }

      function onClick(evt) {
        var el = evt.target.closest("[data-progress-url]");
        if (!el) return;
        evt.preventDefault();
        if (el.dataset.progressRunning === "1") {
          showNotice("<p>" + escapeHtml(progressLabel(el)) + ": already in progress</p>", "info");
          return;
        }
        el.dataset.progressRunning = "1";
        var ap = el.closest(".add-panel");
        if (ap) {
          // B2: the panel's input has served its purpose — collapse it. No
          // busy/pulse state here: the button is about to be hidden and its
          // glow would bleed a sliver during the collapse. The toast + the
          // Start-page card are the feedback.
          ap.classList.remove("add-panel-open");
        } else {
          // B1: a standalone / per-row trigger stays on screen — show it's busy.
          el.setAttribute("aria-disabled", "true");
          el.classList.add("progress-trigger-busy");
        }

        var url = el.getAttribute("data-progress-url");
        var targetSelector = el.getAttribute("data-progress-target");
        // Optional secondary container for `needs_action` panels, so a confirm
        // step lands here instead of overwriting the primary target (e.g. the
        // Jobs list). A terminal result still swaps the primary target and this
        // container gets cleared.
        var actionTarget = el.getAttribute("data-progress-action-target");
        var oobMode = el.hasAttribute("data-progress-oob");
        var body = null;
        if (el.hasAttribute("data-progress-jobs")) {
          var checked = document.querySelectorAll('input[name="job_ids"]:checked');
          if (!checked.length) { resetTrigger(el); return; }
          body = new URLSearchParams();
          checked.forEach(function (cb) { body.append("job_ids", cb.value); });
        }
        var bodyFieldNames = [];
        for (var i = 0; i < el.attributes.length; i++) {
          var attrName = el.attributes[i].name;
          if (attrName.indexOf("data-progress-body-") === 0) {
            bodyFieldNames.push(attrName.slice("data-progress-body-".length));
          }
        }
        if (bodyFieldNames.length) {
          body = new URLSearchParams();
          for (var j = 0; j < bodyFieldNames.length; j++) {
            var fieldName = bodyFieldNames[j];
            var fieldEl = document.querySelector(el.getAttribute("data-progress-body-" + fieldName));
            if (!fieldEl || !fieldEl.value) { resetTrigger(el); return; }
            body.append(fieldName, fieldEl.value);
          }
        }
        var startLabel = progressLabel(el);

        fetch(url, { method: "POST", body: body }).then(function (r) {
          if (!r.ok) throw new Error("Request failed: " + r.status);
          return r.json();
        }).then(function (data) {
          if (data.skipped) {
            resetTrigger(el);
            showNotice("<p>" + escapeHtml(data.message || "Nothing to do.") + "</p>", "info");
            return;
          }
          var noticeText = data.already_active
            ? "Already running: " + startLabel
            : "New task: " + startLabel;
          showNotice("<p>" + escapeHtml(noticeText) + "</p>", "info");
          watched[data.task_id] = {
            el: el, targetSelector: targetSelector, actionTarget: actionTarget,
            oobMode: oobMode, bodyFieldNames: bodyFieldNames,
          };
          pollWatched(data.task_id);
        }).catch(function (err) {
          delete el.dataset.progressRunning;
          showNotice("<p>Error: " + escapeHtml(err && err.message ? err.message : String(err)) + "</p>", "warning");
        });
      }

      document.body.addEventListener("click", onClick);

      // A <form> wrapping one of these buttons (e.g. a text input + Add
      // button) has no native submit handler of its own — pressing Enter in
      // the input would otherwise just do a default (and useless) form
      // submission. Forward it to the button's own click handling instead.
      document.body.addEventListener("submit", function (evt) {
        var btn = evt.target.querySelector("[data-progress-url]");
        if (!btn) return;
        evt.preventDefault();
        btn.click();
      });

      var dismissedSignature = null;

      function renderStatusBar(data) {
        var bar = document.getElementById("status-bar");
        if (!bar) return;
        var tasks = data.tasks || [];
        var signature = tasks.map(function (t) { return t.id; }).join(",");
        if (signature && signature === dismissedSignature && !data.inbox_count) {
          bar.innerHTML = "";
          return;
        }
        var current = tasks.find(function (t) { return t.status === "running"; }) || tasks[0];
        var parts = [];
        if (current) {
          var queuedCount = tasks.length - 1;
          var label = current.label || current.kind.replace(/_/g, " ");
          parts.push('<span><strong>' + escapeHtml(label) + ':</strong></span>');
          if (current.progress) {
            parts.push(
              '<span class="status-bar-progress-track"><span class="status-bar-progress-fill" style="width:' +
              current.progress.percent + '%"></span></span>' +
              '<span>' + current.progress.current + '/' + current.progress.total +
              ' (' + current.progress.percent + '%)</span>'
            );
          } else {
            var statusWord = current.status === "running" ? "started" : current.status;
            parts.push('<span>' + escapeHtml(statusWord) + '</span>');
          }
          parts.push('<a href="/tasks/' + current.id + '">details</a>');
          if (current.link) parts.push('<a href="' + escapeHtml(current.link) + '">view job</a>');
          if (queuedCount > 0) parts.push('<span>+' + queuedCount + ' queued</span>');
        }
        if (data.inbox_count) {
          parts.push('<a href="/">' + data.inbox_count + ' need attention</a>');
        }
        if (parts.length) {
          parts.push('<button type="button" class="status-bar-dismiss" aria-label="Dismiss" data-status-signature="' +
            escapeHtml(signature) + '">×</button>');
        }
        bar.innerHTML = parts.join("");
      }

      document.body.addEventListener("click", function (evt) {
        var dismiss = evt.target.closest(".status-bar-dismiss");
        if (!dismiss) return;
        dismissedSignature = dismiss.getAttribute("data-status-signature") || "";
        var bar = document.getElementById("status-bar");
        if (bar) bar.innerHTML = "";
      });

      function pollAmbient() {
        fetch("/tasks/active").then(function (r) { return r.json(); }).then(function (data) {
          renderStatusBar(data);
        }).catch(function () {});
      }
      pollAmbient();
      setInterval(pollAmbient, 2000);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") pollAmbient();
      });
    })();
  </script>
  <script>
    (function () {
      function jobCheckboxes() {
        return document.querySelectorAll('input[name="job_ids"]');
      }
      function syncSelectAll() {
        var all = jobCheckboxes();
        var checkedCount = document.querySelectorAll('input[name="job_ids"]:checked').length;
        document.querySelectorAll(".select-all-checkbox").forEach(function (sa) {
          sa.checked = all.length > 0 && checkedCount === all.length;
          sa.indeterminate = checkedCount > 0 && checkedCount < all.length;
        });
      }
      // The two fixed bottom bars stack: #status-bar pinned to the viewport
      // bottom, .bulk-bar lifted to sit on top of it. Both heights are published
      // as CSS vars so the bulk bar, the notice stack and the page's bottom
      // padding can offset around whichever bars are visible. A hidden bar is
      // display:none so its rect height is 0. (offsetParent is unreliable here —
      // null for position:fixed elements in Chrome even when visible.)
      function syncBottomBars() {
        var sb = document.getElementById("status-bar");
        var bb = document.querySelector(".bulk-bar");
        document.body.style.setProperty("--status-bar-h", (sb ? sb.getBoundingClientRect().height : 0) + "px");
        document.body.style.setProperty("--bulk-bar-h", (bb ? bb.getBoundingClientRect().height : 0) + "px");
      }
      var bottomBarObserver = new ResizeObserver(syncBottomBars);
      function observeBottomBars() {
        var sb = document.getElementById("status-bar");
        var bb = document.querySelector(".bulk-bar");
        if (sb) bottomBarObserver.observe(sb);
        if (bb) bottomBarObserver.observe(bb);
        syncBottomBars();
      }
      window.addEventListener("resize", syncBottomBars);
      document.body.addEventListener("htmx:afterSwap", observeBottomBars);
      observeBottomBars();
      function updateCount() {
        var checked = document.querySelectorAll('input[name="job_ids"]:checked');
        document.querySelectorAll(".bulk-count").forEach(function (el) {
          el.textContent = checked.length + " selected";
        });
        syncSelectAll();
        syncBottomBars();
      }
      document.body.addEventListener("change", function (evt) {
        if (evt.target.name === "job_ids") updateCount();
      });
      document.body.addEventListener("change", function (evt) {
        if (!evt.target.classList.contains("select-all-checkbox")) return;
        var checked = evt.target.checked;
        jobCheckboxes().forEach(function (cb) { cb.checked = checked; });
        updateCount();
      });
      document.body.addEventListener("click", function (evt) {
        if (!evt.target.classList.contains("bulk-clear")) return;
        document.querySelectorAll('input[name="job_ids"]:checked').forEach(function (cb) {
          cb.checked = false;
        });
        updateCount();
      });
      document.body.addEventListener("htmx:afterSwap", updateCount);
      updateCount();
    })();
  </script>
  <script>
    (function () {
      var mouseIsDown = false;
      var dragging = false;
      var dragStartCheckbox = null;
      var paintValue = null;

      function rowCheckbox(el) {
        var row = el.closest(".job-row");
        return row ? row.querySelector(".job-select") : null;
      }

      function setChecked(cb, value) {
        if (cb.checked !== value) {
          cb.checked = value;
          cb.dispatchEvent(new Event("change", { bubbles: true }));
        }
      }

      document.body.addEventListener("mousedown", function (evt) {
        if (!evt.target.closest(".job-select-wrap")) return;
        mouseIsDown = true;
        dragStartCheckbox = rowCheckbox(evt.target);
      });

      document.body.addEventListener("mouseover", function (evt) {
        if (!mouseIsDown || !dragStartCheckbox) return;
        var cb = rowCheckbox(evt.target);
        if (!cb) return;
        if (!dragging) {
          if (cb === dragStartCheckbox) return;
          dragging = true;
          paintValue = !dragStartCheckbox.checked;
          setChecked(dragStartCheckbox, paintValue);
        }
        setChecked(cb, paintValue);
      });

      document.addEventListener("mouseup", function () {
        mouseIsDown = false;
        dragging = false;
        dragStartCheckbox = null;
        paintValue = null;
      });
    })();
  </script>
  <script>
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.direction-btn');
  if (!btn) return;
  // Scoped to the enclosing panel, not the outer <form> — one form now
  // wraps every scenario's panel, so a form-wide lookup would always hit
  // the first panel's hidden input regardless of which button was clicked.
  var panel = btn.closest('.score-tab-panel');
  var hidden = panel.querySelector('input[name="direction"]');
  var alreadyPressed = btn.getAttribute('aria-pressed') === 'true';
  panel.querySelectorAll('.direction-btn').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
  if (alreadyPressed) {
    hidden.value = '';
  } else {
    hidden.value = btn.dataset.direction;
    btn.setAttribute('aria-pressed', 'true');
  }
});
  </script>
  <script>
function toggleScoreCompare(section, forceOpen) {
  var isOpen;
  if (forceOpen) {
    section.classList.add('score-compare-open');
    isOpen = true;
  } else {
    isOpen = section.classList.toggle('score-compare-open');
  }
  var toggle = section.querySelector('.score-compare-toggle');
  if (toggle) toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}
document.body.addEventListener('change', function (e) {
  var input = e.target.closest('.score-tab-input');
  if (!input) return;
  var section = input.closest('.score-compare');
  if (!section) return;
  section.querySelectorAll('.score-tab-panel').forEach(function (p) {
    p.classList.toggle('score-tab-panel-active', p.dataset.scenarioId === input.value);
  });
});
document.body.addEventListener('click', function (e) {
  var toggle = e.target.closest('.score-compare-toggle');
  if (!toggle) return;
  var section = toggle.closest('.score-compare');
  if (!section) return;
  if (!section.classList.contains('score-compare-open')) {
    // Collapsed: any click in the header (pill or not) just unfolds it.
    // Block the pill's native effect (checking its radio) so folding never
    // also changes which scenario is selected.
    e.preventDefault();
    toggleScoreCompare(section, true);
    return;
  }
  if (e.target.closest('.score-pill, .score-tab-input')) {
    // Open: a pill click only steers the active scenario. Also matches the
    // input itself — clicking a <label for> fires a second, browser-
    // synthesized click targeted directly at its associated bare <input>
    // (not nested inside .score-pill), which would otherwise fall through
    // to the fold branch below and close the section right after opening it.
    return;
  }
  // Open, clicked the rest of the header: fold it back up.
  toggleScoreCompare(section, false);
});
document.body.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var toggle = e.target.closest('.score-compare-toggle');
  if (!toggle) return;
  e.preventDefault();
  var section = toggle.closest('.score-compare');
  if (section) toggleScoreCompare(section, false);
});
  </script>

  <script>
// Capture phase: the permalink anchor carries an inline onclick="event.stopPropagation()"
// (so a click doesn't also toggle the row), which would stop the event before it
// bubbled to any delegated listener. Intercepting on the way down sidesteps that.
document.addEventListener('click', function (e) {
  var permalink = e.target.closest("a.job-link-icon[data-permalink]");
  if (!permalink) return;
  // Modified clicks (Ctrl/Cmd/Shift/Alt, middle button) keep their native
  // behaviour — open in a new tab/window — instead of copying.
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  var full = new URL(permalink.getAttribute("href"), window.location.origin).href;
  var flash = function () {
    permalink.classList.add("job-link-icon--copied");
    setTimeout(function () { permalink.classList.remove("job-link-icon--copied"); }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(full).then(flash, function () { window.location.assign(full); });
  } else {
    window.location.assign(full);
  }
}, true);

document.body.addEventListener('click', function (e) {
  var trigger = e.target.closest('.add-panel-trigger');
  if (trigger) {
    var panel = trigger.closest('.add-panel');
    panel.classList.toggle('add-panel-open');
    var sib = panel.nextElementSibling;
    if (sib && sib.hasAttribute('data-add-result')) sib.innerHTML = '';
    return;
  }
  var cancel = e.target.closest('.add-panel-cancel');
  if (!cancel) return;
  var panel = cancel.closest('.add-panel');
  panel.classList.remove('add-panel-open');
  var form = panel.querySelector('form');
  if (form) form.reset();
});
  </script>
  <script>
    (function () {
      function highlightFromHash() {
        if (!location.hash) return;
        var el;
        try { el = document.querySelector(location.hash); } catch (err) { return; }
        if (!el) return;
        var highlightClass = el.classList.contains("job-row") ? "job-row-target-highlight"
          : el.classList.contains("source-row") ? "source-row-target-highlight"
          : null;
        if (!highlightClass) return;
        // Re-triggering the CSS animation needs the class removed and re-added on a
        // fresh frame — without this, clicking a same-page link to an already-highlighted
        // (or mid-animation) row is a no-op since the class never toggles off/on.
        el.classList.remove(highlightClass);
        void el.offsetWidth;
        el.classList.add(highlightClass);
        el.addEventListener("animationend", function () {
          el.classList.remove(highlightClass);
        }, { once: true });
      }
      highlightFromHash();
      // Same-page anchor clicks (e.g. a notice link to a row already on screen) change
      // location.hash without a navigation/reload, so the initial run above never fires
      // for those — hashchange is the only event that does.
      window.addEventListener("hashchange", highlightFromHash);
    })();
  </script>
