<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Seek{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Fira+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --ground: #faf8f5;
      --surface: #ffffff;
      --border: #e6e0d8;
      --text-primary: #2a2a28;
      --text-secondary: #5f5a54;
      --text-muted: #8b8680;
      --accent: #4a7c8c;
      --accent-light: #6b96a8;
      --accent-tint: #e1e9ed;
      --success: #6b9e7f;
      --success-strong: #3f6b4f;
      --success-tint: #e8ede7;
      --warning: #d4a574;
      --warning-tint: #faf4eb;
      --alert: #b85c5c;
      --alert-tint: #f2e8e8;
      --neutral: #d0c9bf;
      --neutral-strong: #786f63;
      --score-exceptional: #b86849;
      --score-exceptional-tint: #ede5e0;
      --score-high: #4a7c8c;
      --score-high-tint: #e1e9ed;
      --score-mid: #7fa8b8;
      --score-mid-tint: #e9f0f5;
      --score-low: #b0b5b8;
      --score-low-tint: #eceaea;
      --score-neutral-tint: #e9e6e1;

      --font-serif: "Crimson Text", Georgia, serif;
      --font-sans: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ground: #1a1a18;
        --surface: #252521;
        --border: #3a3630;
        --text-primary: #f5f0eb;
        --text-secondary: #c9bfb5;
        --text-muted: #8b8680;
        --accent: #7fa8b8;
        --accent-light: #6b96a8;
        --accent-tint: #26333a;
        --success: #6b9e7f;
        --success-strong: #8fc7a3;
        --success-tint: #1f3a2f;
        --warning: #d4a574;
        --warning-tint: #3a3020;
        --alert: #d18686;
        --alert-tint: #3a1f1f;
        --neutral-strong: #b5aca0;
        --score-exceptional: #d1876a;
        --score-exceptional-tint: #3a2a22;
        --score-high: #7fa8b8;
        --score-high-tint: #223138;
        --score-mid: #6b96a8;
        --score-mid-tint: #1c2a2f;
        --score-low: #8b8f92;
        --score-low-tint: #2c2c29;
        --score-neutral-tint: #33322d;
      }
    }

    :root[data-theme="dark"] {
      --ground: #1a1a18;
      --surface: #252521;
      --border: #3a3630;
      --text-primary: #f5f0eb;
      --text-secondary: #c9bfb5;
      --text-muted: #8b8680;
      --accent: #7fa8b8;
      --accent-light: #6b96a8;
      --accent-tint: #26333a;
      --success: #6b9e7f;
      --success-strong: #8fc7a3;
      --success-tint: #1f3a2f;
      --warning: #d4a574;
      --warning-tint: #3a3020;
      --alert: #d18686;
      --alert-tint: #3a1f1f;
      --neutral-strong: #b5aca0;
      --score-exceptional: #d1876a;
      --score-exceptional-tint: #3a2a22;
      --score-high: #7fa8b8;
      --score-high-tint: #223138;
      --score-mid: #6b96a8;
      --score-mid-tint: #1c2a2f;
      --score-low: #8b8f92;
      --score-low-tint: #2c2c29;
      --score-neutral-tint: #33322d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--ground);
      color: var(--text-primary);
      line-height: 1.5;
      max-width: 880px;
      margin: 0 auto;
      padding: 1.5rem 1rem 2rem;
    }

    a { color: var(--accent); }

    h1 {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 1.8rem;
      margin: 0 0 1rem;
    }

    nav { margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
    nav a { text-decoration: none; color: var(--text-secondary); font-weight: 500; }
    nav a:hover { color: var(--accent); }
    nav a.active { font-weight: 600; color: var(--text-primary); }

    .score-badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.82em; font-weight: 600; font-family: var(--font-sans); }
    .score-exceptional { background: var(--score-exceptional-tint); color: var(--score-exceptional); }
    .score-high { background: var(--score-high-tint); color: var(--score-high); }
    .score-mid { background: var(--score-mid-tint); color: var(--score-mid); }
    .score-low { background: var(--score-low-tint); color: var(--score-low); }
    .score-neutral { background: var(--score-neutral-tint); color: var(--text-secondary); }

    .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.8em; background: var(--border); color: var(--text-secondary); }
    .tag-accent { background: var(--accent-tint); color: var(--accent); }
    .tag-feedback { background: var(--accent-tint); color: var(--accent); }

    .job-row {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 0.6rem;
      position: relative;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .job-row:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
    .job-row-stale { opacity: 0.55; }
    .job-row-stale:hover { opacity: 0.85; }
    .stale-note { margin: 0.35rem 0 0; font-size: 0.9em; color: var(--text-muted); }
    .stale-note a { color: inherit; }

    .job-row-score { flex: none; display: flex; }
    .job-row-score .score-badge {
      display: flex;
      align-items: center;
      border-radius: 0;
      padding: 0 0.9rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .job-select-wrap { position: absolute; top: 0.3rem; right: 0.15rem; padding: 0.35rem; cursor: pointer; line-height: 0; z-index: 2; }
    .job-select-wrap input { width: 1.15rem; height: 1.15rem; margin: 0; cursor: pointer; }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    dl.job-tags { display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; margin:0.5rem 0 0; }
    dl.job-tags dt, dl.job-tags dd { margin:0; }

    .job-row-content { flex: 1 1 auto; min-width: 0; padding: 0.75rem 0.9rem; display: flex; flex-direction: column; }
    .job-row-header { display: flex; align-items: baseline; gap: 0.9rem; padding-right: 1.6rem; }
    .job-title { margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 1.05rem; color: var(--text-primary); flex: 0 1 auto; min-width: 0; }
    .job-company { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; }
    .job-age { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
    .job-link-icon { text-decoration:none; font-size:0.85em; padding: 0.2rem 0.35rem; line-height: 1; border-radius: 4px; color: var(--text-muted); flex: none; }
    .job-link-icon:hover { background: var(--ground); color: var(--accent); }
    .job-hook { margin: 0.35rem 0 0; color: var(--text-secondary); font-size: 0.92rem; line-height: 1.45; }

    .job-row-expanded { display: block; padding: 1rem 1.1rem; }
    .job-detail-header { cursor: pointer; }
    .job-detail-title-row { display: flex; align-items: baseline; gap: 0.75rem; padding-right: 1.6rem; }
    .job-detail-title { font-family: var(--font-serif); font-weight: 600; font-size: 1.5rem; margin: 0; flex: 1 1 auto; min-width: 0; }
    .job-detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: 0.35rem; font-size: 0.9rem; color: var(--text-secondary); }
    .job-detail-meta a { color: var(--text-secondary); }
    .job-detail-meta a:hover { color: var(--accent); }
    .job-detail-header .job-hook { font-size: 0.95rem; }
    .job-detail-header dl.job-tags { margin-top: 0.75rem; }

    .score-box { margin-top:0.75rem; padding:0.75rem; border:1px solid var(--border); border-radius:6px; background:var(--ground); }
    .score-box dl.job-tags { margin-bottom:0.5rem; }
    .score-compare-details summary { cursor:pointer; display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem; list-style:none; }
    .score-compare-details summary::-webkit-details-marker { display:none; }
    .score-compare-details summary::before { content:"▸"; color: var(--text-muted); }
    .score-compare-details[open] summary::before { content:"▾"; }
    .score-compare-details summary > span:first-child { font-weight:600; margin-right:0.2rem; color: var(--text-secondary); }
    .score-compare-details summary .score-compare-summary-scores { display:contents; }
    .score-compare-pair { display:inline-flex; align-items:center; gap:0; border-radius:999px; overflow:hidden; }
    .score-compare-pair .tag { border-radius:0; margin:0; font-size:0.85em; }
    .score-compare-pair .score-badge { border-radius:0; margin:0; }
    .score-compare-details[open] summary .score-compare-summary-scores { display:none; }
    .score-compare-details > form { margin-top:0.75rem; }
    .score-tabs { display:flex; flex-wrap:wrap; }
    .score-tab-input { position:absolute; opacity:0; width:0; height:0; }
    .score-tab-card { display:flex; align-items:center; gap:0.3rem; padding:0.3rem 0.6rem; margin:0 0.3rem 0.5rem 0; border:1px solid var(--border); border-radius:6px; cursor:pointer; background:var(--surface); }
    .score-tab-input:checked + .score-tab-card { border-color: var(--accent); background: var(--accent-tint); }
    .score-tab-panel { display:none; width:100%; order:1; }
    .score-tab-input:checked + .score-tab-card + .score-tab-panel { display:block; }
    .fit-scorecard-grid { display:grid; grid-template-columns:auto 1fr; gap:0.4rem 0.75rem; align-items:start; margin:0; }
    .fit-scorecard-grid dt { font-weight:600; color: var(--text-secondary); }
    .fit-scorecard-grid dd { margin:0; }
    .direction-toggle { display:flex; gap:0.4rem; margin:0.4rem 0; }
    .direction-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); }
    .scenario-feedback-form textarea { width:100%; min-height:3em; margin:0.3rem 0; }
    .scenario-feedback-form > button[type="submit"] { margin-top:0.5rem; }
    .save-confirmation { margin:0 0 0.5rem; padding:0.3rem 0.6rem; border-radius:4px; background: var(--success-tint); color: var(--success); font-size:0.9em; overflow:hidden; animation: fade-out 2.5s ease-in forwards; }
    @keyframes fade-out {
      0%, 60% { opacity:1; max-height:3rem; margin-bottom:0.5rem; padding-top:0.3rem; padding-bottom:0.3rem; }
      100% { opacity:0; max-height:0; margin-bottom:0; padding-top:0; padding-bottom:0; }
    }
    .job-row-target-highlight, .source-row-target-highlight { animation: target-highlight 2.5s ease-out; }
    @keyframes target-highlight {
      0% { background: var(--warning-tint); }
      100% { background: transparent; }
    }
    .job-details { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .decision-panel { grid-template-columns: 1fr minmax(180px, auto); gap: 0.5rem 1rem; }
    .decision-panel-left { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; }
    .decision-panel-left .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: auto 0 0; }
    .decision-panel-note { display: flex; flex-direction: column; margin: 0; }
    .decision-panel-note textarea { flex: 1; width: 100%; min-height: 60px; box-sizing: border-box; resize: vertical; }
    .bulk-clear-x { position: absolute; top: 0.4rem; right: 0.5rem; padding: 0 6px; line-height: 1.4;
      border: none; border-radius: 4px; background: transparent; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .bulk-clear-x:hover { color: var(--text-primary); background: var(--ground); }
    .btn, select, .text-input {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); box-sizing: border-box;
      font: inherit; background: var(--surface); color: var(--text-primary);
    }
    .btn { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-light); border-color: var(--accent-light); }
    .btn-accept { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
    .btn-accept:hover { filter: brightness(1.08); }
    .btn-reject { background: var(--alert); border-color: var(--alert); color: #fff; font-weight: 600; }
    .btn-reject:hover { filter: brightness(1.08); }
    .btn-trash { background: var(--neutral-strong); border-color: var(--neutral-strong); color: #fff; font-weight: 600; }
    .btn-trash:hover { filter: brightness(1.08); }
    .btn-delete { background: var(--alert); color: #fff; border-color: var(--alert); font-weight: 600; }
    .btn-delete:hover { filter: brightness(1.08); }
    .job-advanced { display: inline-flex; align-items: center; gap: 0.5rem; }
    .feedback-form + .job-advanced { margin-top: 0.5rem; }
    .job-advanced summary { cursor: pointer; color: var(--text-muted); font-size: 0.85em; user-select: none; }
    .feedback-form label { display: block; margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.92rem; }
    .setup-form .form-row { margin-bottom: 1.1rem; }
    .setup-form .form-row label { display: block; margin-bottom: 0.35rem; font-weight: 500; }
    .feedback-form textarea { width: 100%; min-height: 60px; }
    .feedback-form .actions { margin-top: 0.75rem; }
    textarea, input, select { font-family: inherit; background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
    .reset-progress { grid-column: 1 / -1; display: block; width: 100%; color: var(--text-muted); font-size: 0.85em; }
    .reset-progress:empty { display: none; }
    .filter-bar { margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .filter-bar a { margin-right: 0.5rem; color: var(--text-secondary); text-decoration: none; }
    .filter-bar a:hover { color: var(--accent); }
    .filter-bar a.active { font-weight: 600; color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--accent); }
    .select-all { display: flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); white-space: nowrap; }
    .select-all input { width: 1.15rem; height: 1.15rem; margin: 0; cursor: pointer; }
    body:has(input[name="job_ids"]:checked) { padding-bottom: 11rem; }
    .bulk-bar { display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 880px; box-sizing: border-box; z-index: 10;
      background: var(--surface); border-top: 2px solid var(--accent); box-shadow: 0 -2px 12px rgba(0,0,0,0.08); padding: 0.75rem 1rem; }
    #jobs-content:has(input[name="job_ids"]:checked) .bulk-bar { display: grid; }
    .config-banner { background: var(--alert-tint); color: var(--alert); border: 2px solid var(--alert); border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-size: 1.05rem; }
    .config-banner strong { display: block; margin-bottom: 0.25rem; }
    .checklist { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    .checklist li { padding: 0.4rem 0; }
    .checklist li.done a { color: var(--success-strong); font-weight: 600; }
    .checklist li.todo a { color: var(--accent); font-weight: 600; }
    .actionable-block { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;
      margin-bottom: 1.5rem; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .how-it-works ol { padding-left: 1.25rem; }
    .how-it-works li { margin-bottom: 0.5rem; }
    .how-it-works li ol { list-style-type: lower-alpha; margin-top: 0.5rem; }
    .how-it-works li ol li { color: var(--text-secondary); }
    #notice-stack:empty { display: none; }
    .notice { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;
      padding: 0.6rem 0.9rem; margin-bottom: 0.75rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface); transition: opacity 0.6s ease; }
    .notice.notice-fade-out { opacity: 0; }
    .notice p { margin: 0; }
    .notice-warning { background: var(--warning-tint); border-color: var(--warning); color: var(--warning); }
    .notice-dismiss { flex: none; background: none; border: none; cursor: pointer; font-size: 1.1rem;
      line-height: 1; color: inherit; opacity: 0.6; padding: 0 0.15rem; }
    .notice-dismiss:hover { opacity: 1; }
  </style>
</head>
<body>
  <script>
    window.autoDismissNotice = function (el, delayMs) {
      if (!el) return;
      setTimeout(function () {
        el.classList.add("notice-fade-out");
        setTimeout(function () { if (el.parentNode) el.remove(); }, 600);
      }, delayMs || 30000);
    };
  </script>
  <nav>
    <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Start</a>
    <a href="/jobs" {% if request.url.path == "/jobs" %}class="active"{% endif %}>Jobs</a>
    <a href="/fetch" {% if request.url.path == "/fetch" %}class="active"{% endif %}>Fetch</a>
    <a href="/sources" {% if request.url.path == "/sources" %}class="active"{% endif %}>Sources</a>
    <a href="/profile" {% if request.url.path == "/profile" %}class="active"{% endif %}>Profile</a>
    <a href="/scenarios" {% if request.url.path == "/scenarios" %}class="active"{% endif %}>Scenarios</a>
    <a href="/setup" {% if request.url.path == "/setup" %}class="active"{% endif %}>Setup</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function () {
      function showNotice(html, level) {
        var stack = document.getElementById("notice-stack");
        if (!stack) return;
        var wrapper = document.createElement("div");
        wrapper.className = "notice" + (level === "warning" ? " notice-warning" : "");
        var content = document.createElement("div");
        content.innerHTML = html;
        var dismissBtn = document.createElement("button");
        dismissBtn.type = "button";
        dismissBtn.className = "notice-dismiss";
        dismissBtn.setAttribute("aria-label", "Dismiss");
        dismissBtn.textContent = "×";
        dismissBtn.addEventListener("click", function () { wrapper.remove(); });
        wrapper.appendChild(content);
        wrapper.appendChild(dismissBtn);
        stack.appendChild(wrapper);
        setTimeout(function () {
          wrapper.classList.add("notice-fade-out");
          setTimeout(function () {
            if (wrapper.parentNode) wrapper.remove();
          }, 600);
        }, 30000);
      }

      function onClick(evt) {
        var el = evt.target.closest("[data-progress-url]");
        if (!el) return;
        evt.preventDefault();
        if (el.dataset.progressRunning === "1") return;
        el.dataset.progressRunning = "1";

        var url = el.getAttribute("data-progress-url");
        var targetSelector = el.getAttribute("data-progress-target");
        var oobMode = el.hasAttribute("data-progress-oob");
        var body = null;
        if (el.hasAttribute("data-progress-jobs")) {
          var checked = document.querySelectorAll('input[name="job_ids"]:checked');
          if (!checked.length) return;
          body = new URLSearchParams();
          checked.forEach(function (cb) { body.append("job_ids", cb.value); });
        }
        var bodyFieldNames = [];
        for (var i = 0; i < el.attributes.length; i++) {
          var attrName = el.attributes[i].name;
          if (attrName.indexOf("data-progress-body-") === 0) {
            bodyFieldNames.push(attrName.slice("data-progress-body-".length));
          }
        }
        if (bodyFieldNames.length) {
          body = new URLSearchParams();
          for (var j = 0; j < bodyFieldNames.length; j++) {
            var fieldName = bodyFieldNames[j];
            var fieldEl = document.querySelector(el.getAttribute("data-progress-body-" + fieldName));
            if (!fieldEl || !fieldEl.value) return;
            body.append(fieldName, fieldEl.value);
          }
        }
        var displaySelector = el.getAttribute("data-progress-display");
        var displayTarget = displaySelector ? document.querySelector(displaySelector) : null;
        var progressEl = document.createElement("span");
        if (displayTarget) {
          displayTarget.appendChild(progressEl);
        } else {
          progressEl.style.marginLeft = "0.5rem";
          progressEl.style.color = "#666";
          el.insertAdjacentElement("afterend", progressEl);
        }

        var start = Date.now();
        var lastLine = "";
        var htmlChunk = null;
        var failed = false;

        function tick() {
          var elapsed = Math.round((Date.now() - start) / 1000);
          progressEl.textContent = elapsed + "s" + (lastLine ? " — " + lastLine : "");
        }

        tick();
        var tickTimer = setInterval(tick, 1000);

        function finish() {
          if (tickTimer) clearInterval(tickTimer);
          delete el.dataset.progressRunning;
          if (failed) {
            progressEl.style.color = "#dc3545";
            progressEl.textContent = lastLine || "Failed";
            return;
          }
          // The server may stream a final informational line (e.g. "Failed to
          // fetch: ..." or "Already tracked: ...") without it counting as a
          // transport-level failure — the request still completes normally.
          // Leave that line on screen for a moment before wiping it and doing
          // the swap below, so it's readable instead of flashing by instantly.
          tick();
          setTimeout(function () {
            progressEl.remove();
            for (var k = 0; k < bodyFieldNames.length; k++) {
              var clearFieldEl = document.querySelector(el.getAttribute("data-progress-body-" + bodyFieldNames[k]));
              if (clearFieldEl) clearFieldEl.value = "";
            }
            if (oobMode) {
              // Each HTML: chunk was already applied as it streamed in via applyOob().
            } else if (targetSelector) {
              var target = document.querySelector(targetSelector);
              if (target && htmlChunk != null) {
                target.innerHTML = htmlChunk;
                if (window.htmx) window.htmx.process(target);
              }
            } else {
              location.reload();
            }
          }, 3500);
        }

        function applyOob(chunk) {
          // htmx's OOB swap machinery only fires while htmx is settling a
          // response it fetched itself (hx-get/hx-post/etc) — htmx.process()
          // on manually-inserted content does NOT trigger it. So instead of
          // relying on hx-swap-oob, parse the chunk and replace each id'd
          // top-level element directly. A chunk may carry one element (a
          // job row) or several siblings (e.g. the six nav-count spans).
          var container = document.createElement("div");
          container.innerHTML = chunk;
          Array.prototype.forEach.call(container.children, function (node) {
            if (!node.id) return;
            var existing = document.getElementById(node.id);
            if (!existing) return;
            existing.outerHTML = node.outerHTML;
            var replaced = document.getElementById(node.id);
            if (replaced && window.htmx) window.htmx.process(replaced);
          });
        }

        function handleLine(line) {
          if (!line) return;
          if (line.indexOf("NOTICE:") === 0) {
            var noticeBody = line.slice(7);
            var noticeLevel = "info";
            if (noticeBody.indexOf("warning:") === 0) {
              noticeLevel = "warning";
              noticeBody = noticeBody.slice(8);
            }
            showNotice(noticeBody, noticeLevel);
          } else if (line.indexOf("HTML:") === 0) {
            var chunk = line.slice(5);
            if (oobMode) {
              applyOob(chunk);
            } else {
              htmlChunk = chunk;
            }
          } else {
            lastLine = line;
            tick();
          }
        }

        fetch(url, { method: "POST", body: body }).then(function (response) {
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";

          function pump() {
            return reader.read().then(function (result) {
              if (result.done) {
                if (buffer) handleLine(buffer);
                finish();
                return;
              }
              buffer += decoder.decode(result.value, { stream: true });
              var lines = buffer.split("\n");
              buffer = lines.pop();
              lines.forEach(handleLine);
              return pump();
            });
          }

          return pump();
        }).catch(function (err) {
          failed = true;
          lastLine = "Error: " + (err && err.message ? err.message : err);
          finish();
        });
      }

      document.body.addEventListener("click", onClick);

      // A <form> wrapping one of these buttons (e.g. a text input + Add
      // button) has no native submit handler of its own — pressing Enter in
      // the input would otherwise just do a default (and useless) form
      // submission. Forward it to the button's own click handling instead.
      document.body.addEventListener("submit", function (evt) {
        var btn = evt.target.querySelector("[data-progress-url]");
        if (!btn) return;
        evt.preventDefault();
        btn.click();
      });
    })();
  </script>
  <script>
    (function () {
      function jobCheckboxes() {
        return document.querySelectorAll('input[name="job_ids"]');
      }
      function syncSelectAll() {
        var all = jobCheckboxes();
        var checkedCount = document.querySelectorAll('input[name="job_ids"]:checked').length;
        document.querySelectorAll(".select-all-checkbox").forEach(function (sa) {
          sa.checked = all.length > 0 && checkedCount === all.length;
          sa.indeterminate = checkedCount > 0 && checkedCount < all.length;
        });
      }
      function updateCount() {
        var checked = document.querySelectorAll('input[name="job_ids"]:checked');
        document.querySelectorAll(".bulk-count").forEach(function (el) {
          el.textContent = checked.length + " selected";
        });
        syncSelectAll();
      }
      document.body.addEventListener("change", function (evt) {
        if (evt.target.name === "job_ids") updateCount();
      });
      document.body.addEventListener("change", function (evt) {
        if (!evt.target.classList.contains("select-all-checkbox")) return;
        var checked = evt.target.checked;
        jobCheckboxes().forEach(function (cb) { cb.checked = checked; });
        updateCount();
      });
      document.body.addEventListener("click", function (evt) {
        if (!evt.target.classList.contains("bulk-clear")) return;
        document.querySelectorAll('input[name="job_ids"]:checked').forEach(function (cb) {
          cb.checked = false;
        });
        updateCount();
      });
      document.body.addEventListener("htmx:afterSwap", updateCount);
      updateCount();
    })();
  </script>
  <script>
    (function () {
      var mouseIsDown = false;
      var dragging = false;
      var dragStartCheckbox = null;
      var paintValue = null;

      function rowCheckbox(el) {
        var row = el.closest(".job-row");
        return row ? row.querySelector(".job-select") : null;
      }

      function setChecked(cb, value) {
        if (cb.checked !== value) {
          cb.checked = value;
          cb.dispatchEvent(new Event("change", { bubbles: true }));
        }
      }

      document.body.addEventListener("mousedown", function (evt) {
        if (!evt.target.closest(".job-select-wrap")) return;
        mouseIsDown = true;
        dragStartCheckbox = rowCheckbox(evt.target);
      });

      document.body.addEventListener("mouseover", function (evt) {
        if (!mouseIsDown || !dragStartCheckbox) return;
        var cb = rowCheckbox(evt.target);
        if (!cb) return;
        if (!dragging) {
          if (cb === dragStartCheckbox) return;
          dragging = true;
          paintValue = !dragStartCheckbox.checked;
          setChecked(dragStartCheckbox, paintValue);
        }
        setChecked(cb, paintValue);
      });

      document.addEventListener("mouseup", function () {
        mouseIsDown = false;
        dragging = false;
        dragStartCheckbox = null;
        paintValue = null;
      });
    })();
  </script>
  <script>
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.direction-btn');
  if (!btn) return;
  // Scoped to the enclosing panel, not the outer <form> — one form now
  // wraps every scenario's panel, so a form-wide lookup would always hit
  // the first panel's hidden input regardless of which button was clicked.
  var panel = btn.closest('.score-tab-panel');
  var hidden = panel.querySelector('input[name="direction"]');
  var alreadyPressed = btn.getAttribute('aria-pressed') === 'true';
  panel.querySelectorAll('.direction-btn').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
  if (alreadyPressed) {
    hidden.value = '';
  } else {
    hidden.value = btn.dataset.direction;
    btn.setAttribute('aria-pressed', 'true');
  }
});
  </script>
  <script>
document.body.addEventListener('click', function (e) {
  var btn = e.target.closest('.feedback-form .actions button[type="submit"]');
  if (!btn) return;
  var row = btn.closest('.job-row');
  var scenarioForm = row && row.querySelector('.scenario-feedback-form');
  if (scenarioForm && window.htmx) {
    htmx.trigger(scenarioForm, 'submit');
  }
});
  </script>
  <script>
    (function () {
      function highlightFromHash() {
        if (!location.hash) return;
        var el;
        try { el = document.querySelector(location.hash); } catch (err) { return; }
        if (!el) return;
        var highlightClass = el.classList.contains("job-row") ? "job-row-target-highlight"
          : el.classList.contains("source-row") ? "source-row-target-highlight"
          : null;
        if (!highlightClass) return;
        // Re-triggering the CSS animation needs the class removed and re-added on a
        // fresh frame — without this, clicking a same-page link to an already-highlighted
        // (or mid-animation) row is a no-op since the class never toggles off/on.
        el.classList.remove(highlightClass);
        void el.offsetWidth;
        el.classList.add(highlightClass);
        el.addEventListener("animationend", function () {
          el.classList.remove(highlightClass);
        }, { once: true });
      }
      highlightFromHash();
      // Same-page anchor clicks (e.g. a notice link to a row already on screen) change
      // location.hash without a navigation/reload, so the initial run above never fires
      // for those — hashchange is the only event that does.
      window.addEventListener("hashchange", highlightFromHash);
    })();
  </script>
