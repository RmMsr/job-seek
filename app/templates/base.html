<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Seek{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #0066cc; }
    nav a.active { font-weight: bold; color: #000; }
    .score-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
    .score-high { background: #d4edda; color: #155724; }
    .score-mid { background: #fff3cd; color: #856404; }
    .score-low { background: #f8d7da; color: #721c24; }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; background: #e9ecef; }
    .job-row { border: 1px solid #dee2e6; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; position: relative; }
    .job-row:hover { background: #f8f9fa; }
    .job-select-wrap { position: absolute; top: 0; right: 0; padding: 0.75rem; cursor: pointer; line-height: 0; }
    .job-select-wrap input { width: 1.15rem; height: 1.15rem; margin: 0; cursor: pointer; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    dl.job-tags { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; margin:0; }
    dl.job-tags dt, dl.job-tags dd { margin:0; }
    .job-title { margin:0.5rem 0 0.25rem; font-size:1.1rem; }
    .job-hook { margin:0.25rem 0 0; color:#444; }
    .score-box { margin-top:0.75rem; padding:0.75rem; border:1px solid #dee2e6; border-radius:6px; background:#f8f9fa; }
    .score-box dl.job-tags { margin-bottom:0.5rem; }
    .feedback-form .actions { margin-top:0.75rem; }
    .job-details { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #eee; }
    .feedback-form label { display: block; margin-top: 0.5rem; }
    .feedback-form textarea { width: 100%; min-height: 60px; }
    .btn { padding: 6px 14px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; }
    .btn-accept { background: #d4edda; border-color: #28a745; }
    .btn-reject { background: #f8d7da; border-color: #dc3545; }
    .btn-invalid { background: #e9ecef; border-color: #6c757d; }
    .filter-bar { margin-bottom: 1rem; }
    .filter-bar a { margin-right: 0.5rem; }
    body:has(input[name="job_ids"]:checked) { padding-bottom: 11rem; }
    .bulk-bar { display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 960px; box-sizing: border-box; z-index: 10;
      grid-template-columns: minmax(180px, auto) 1fr; grid-template-rows: auto auto auto; gap: 0.5rem 1rem;
      background: #fff; border-top: 2px solid #0066cc; box-shadow: 0 -2px 8px rgba(0,0,0,0.08); padding: 0.75rem 1rem; }
    #jobs-content:has(input[name="job_ids"]:checked) .bulk-bar { display: grid; }
    .bulk-bar-header { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.75rem; }
    .bulk-scenario { grid-column: 1; grid-row: 2; }
    .bulk-scenario select { width: 100%; }
    .bulk-bar .actions { grid-column: 1; grid-row: 3; margin-top: 0; align-self: start; }
    .bulk-note { grid-column: 2; grid-row: 2 / span 2; display: flex; flex-direction: column; }
    .bulk-note textarea { flex: 1; width: 100%; min-height: 60px; box-sizing: border-box; resize: vertical; }
  </style>
</head>
<body>
  <nav>
    <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Jobs</a>
    <a href="/fetch" {% if request.url.path == "/fetch" %}class="active"{% endif %}>Fetch</a>
    <a href="/sources" {% if request.url.path == "/sources" %}class="active"{% endif %}>Sources</a>
    <a href="/profile" {% if request.url.path == "/profile" %}class="active"{% endif %}>Profile</a>
    <a href="/scenarios" {% if request.url.path == "/scenarios" %}class="active"{% endif %}>Scenarios</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function () {
      function onClick(evt) {
        var el = evt.target.closest("[data-progress-url]");
        if (!el) return;
        evt.preventDefault();
        if (el.dataset.progressRunning === "1") return;
        el.dataset.progressRunning = "1";

        var url = el.getAttribute("data-progress-url");
        var targetSelector = el.getAttribute("data-progress-target");
        var progressEl = document.createElement("span");
        progressEl.style.marginLeft = "0.5rem";
        progressEl.style.color = "#666";
        progressEl.hidden = true;
        el.insertAdjacentElement("afterend", progressEl);

        var start = Date.now();
        var revealed = false;
        var lastLine = "";
        var tickTimer = null;
        var htmlChunk = null;
        var failed = false;

        function tick() {
          var elapsed = Math.round((Date.now() - start) / 1000);
          progressEl.textContent = elapsed + "s" + (lastLine ? " — " + lastLine : "");
        }

        var revealTimer = setTimeout(function () {
          revealed = true;
          progressEl.hidden = false;
          tick();
          tickTimer = setInterval(tick, 1000);
        }, 5000);

        function finish() {
          clearTimeout(revealTimer);
          if (tickTimer) clearInterval(tickTimer);
          delete el.dataset.progressRunning;
          if (failed) {
            progressEl.hidden = false;
            progressEl.style.color = "#dc3545";
            progressEl.textContent = lastLine || "Failed";
            return;
          }
          progressEl.remove();
          if (targetSelector) {
            var target = document.querySelector(targetSelector);
            if (target && htmlChunk != null) {
              target.innerHTML = htmlChunk;
              if (window.htmx) window.htmx.process(target);
            }
          } else {
            location.reload();
          }
        }

        function handleLine(line) {
          if (!line) return;
          if (line.indexOf("HTML:") === 0) {
            htmlChunk = line.slice(5);
          } else {
            lastLine = line;
            if (revealed) tick();
          }
        }

        fetch(url, { method: "POST" }).then(function (response) {
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";

          function pump() {
            return reader.read().then(function (result) {
              if (result.done) {
                if (buffer) handleLine(buffer);
                finish();
                return;
              }
              buffer += decoder.decode(result.value, { stream: true });
              var lines = buffer.split("\n");
              buffer = lines.pop();
              lines.forEach(handleLine);
              return pump();
            });
          }

          return pump();
        }).catch(function (err) {
          failed = true;
          lastLine = "Error: " + (err && err.message ? err.message : err);
          finish();
        });
      }

      document.body.addEventListener("click", onClick);
    })();
  </script>
  <script>
    (function () {
      function updateCount() {
        var checked = document.querySelectorAll('input[name="job_ids"]:checked');
        document.querySelectorAll(".bulk-count").forEach(function (el) {
          el.textContent = checked.length + " selected";
        });
      }
      document.body.addEventListener("change", function (evt) {
        if (evt.target.name === "job_ids") updateCount();
      });
      document.body.addEventListener("click", function (evt) {
        if (!evt.target.classList.contains("bulk-clear")) return;
        document.querySelectorAll('input[name="job_ids"]:checked').forEach(function (cb) {
          cb.checked = false;
        });
        updateCount();
      });
      document.body.addEventListener("htmx:afterSwap", updateCount);
    })();
  </script>
</body>
</html>
