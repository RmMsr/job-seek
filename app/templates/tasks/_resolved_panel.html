<div class="resolved-panel">
  {% if task.status == "dismissed" %}
    <p>✓ Dismissed <span class="task-age">{{ task.finished_at | age }}</span></p>
  {% else %}
    <p>✓ {{ pres.next_step }}</p>
    {% if pres.results %}
    <p>{% for r in pres.results %}<a href="{{ r.href }}">{{ r.label }}</a>{% if not loop.last %} · {% endif %}{% endfor %}</p>
    {% endif %}
  {% endif %}
</div>
